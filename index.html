<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Tools</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>My PDF Tools</h1>
        <p>Simple tools for your everyday files</p>

        <div class="tools">
            <div class="tool">
                <h2>📄 PDF to Excel</h2>
                <p>Convert PDF files into Excel.</p>
                <button>Choose PDF</button>
            </div>

            <div class="tool">
                <h2>🖼️ Image to PDF</h2>
                <p>Convert images into PDF.</p>
                <button>Choose Image</button>
            </div>

            <div class="tool">
                <h2>📐 Resize Image</h2>
                <p>Resize your images easily.</p>
                <button>Choose Image</button>
            </div>
        </div>
    </div>

</body>
</html>
